<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Family Connect - Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#020617;
  color:#fff;
  font-family:Arial,sans-serif;
}

header{
  height:58px;
  background:#0f172a;
  border-bottom:1px solid #334155;
  display:flex;
  align-items:center;
  padding:0 14px;
  gap:12px;
}

.logo{font-weight:bold}

.status{
  margin-left:auto;
  color:#86efac;
  font-size:12px;
}

.logout{
  border:0;
  background:#dc2626;
  color:#fff;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
}

.main{
  min-height:calc(100vh - 58px);
  display:flex;
}

.sidebar{
  width:64px;
  background:#0f172a;
  border-right:1px solid #334155;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:9px;
  padding-top:12px;
}

.sideBtn{
  width:46px;
  height:46px;
  border:0;
  border-radius:11px;
  background:#1e293b;
  color:#fff;
  font-size:19px;
  cursor:pointer;
}

.sideBtn:hover{background:#2563eb}

.content{
  flex:1;
  padding:12px;
}

.videoArea{
  height:58vh;
  min-height:300px;
  background:#000;
  border:1px solid #334155;
  border-radius:15px;
  overflow:hidden;
  position:relative;
}

#localVideo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
}

.videoText{
  position:absolute;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#64748b;
}

.controls{
  display:flex;
  justify-content:center;
  gap:9px;
  margin:10px 0;
}

.control{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:#1e293b;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

.end{background:#dc2626}

.panel{
  background:#0f172a;
  border:1px solid #334155;
  border-radius:13px;
  padding:13px;
  margin-top:10px;
}

.panel h3{
  margin:0 0 10px;
  font-size:14px;
}

.inviteRow{
  display:flex;
  gap:7px;
}

input{
  flex:1;
  min-width:0;
  background:#020617;
  border:1px solid #334155;
  color:#fff;
  border-radius:8px;
  padding:10px;
}

.action{
  border:0;
  background:#2563eb;
  color:#fff;
  border-radius:8px;
  padding:9px 12px;
  cursor:pointer;
}

.msg{
  margin-top:8px;
  font-size:12px;
  color:#94a3b8;
}

.incoming{
  display:none;
  position:fixed;
  right:18px;
  bottom:18px;
  width:min(360px,calc(100% - 36px));
  background:#0f172a;
  border:1px solid #475569;
  border-radius:16px;
  padding:18px;
  z-index:999;
  box-shadow:0 20px 70px #000;
}

.incoming h2{
  margin:0 0 8px;
  font-size:18px;
}

.incoming p{
  color:#94a3b8;
}

.accept{
  background:#16a34a;
  color:#fff;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.reject{
  background:#dc2626;
  color:#fff;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

@media(max-width:600px){
  .inviteRow{flex-direction:column}
  .sidebar{width:58px}
  .sideBtn{width:42px;height:42px}
}
</style>
</head>

<body>

<header>
  <div class="logo">👑 Family Connect Admin</div>

  <div id="status" class="status">
    Connecting...
  </div>

  <button class="logout" id="logoutBtn">
    Logout
  </button>
</header>

<div class="main">

  <aside class="sidebar">

    <button class="sideBtn" id="cameraBtn">📹</button>

    <button class="sideBtn" id="micBtn">🎙️</button>

    <button class="sideBtn" id="mirrorBtn">🔄</button>

    <button class="sideBtn" id="bgBtn">🖼️</button>

    <button class="sideBtn" id="inviteBtn">🔗</button>

    <button class="sideBtn" id="endBtn">📞</button>

  </aside>

  <main class="content">

    <div class="videoArea">

      <video
        id="localVideo"
        autoplay
        muted
        playsinline>
      </video>

      <div id="videoText" class="videoText">
        📹 Camera बंद है
      </div>

    </div>

    <div class="controls">

      <button class="control" id="cameraBtn2">📹</button>

      <button class="control" id="micBtn2">🎙️</button>

      <button class="control" id="mirrorBtn2">🔄</button>

      <button class="control" id="bgBtn2">🖼️</button>

      <button class="control end" id="endBtn2">📞</button>

    </div>

    <div class="panel">

      <h3>🔗 Private Family Invite</h3>

      <div class="inviteRow">

        <input
          id="inviteLink"
          readonly
          placeholder="Create Invite दबाएँ">

        <button class="action" id="createInviteBtn">
          Create
        </button>

        <button class="action" id="copyBtn">
          Copy
        </button>

      </div>

      <div id="inviteMsg" class="msg">
        Guest को भेजने के लिए Secure Invite बनाएँ।
      </div>

    </div>

  </main>

</div>

<!-- INCOMING CALL -->

<div id="incoming" class="incoming">

  <h2>📞 Incoming Call</h2>

  <p>
    <b id="callerName">Family Member</b>
    आपको video call कर रहे हैं।
  </p>

  <button class="accept" id="acceptBtn">
    ✅ Accept
  </button>

  <button class="reject" id="rejectBtn">
    ❌ Reject
  </button>

</div>

<script type="module">

/* ===============================
   FIREBASE
================================ */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  updateDoc,
  onSnapshot,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ===============================
   FIREBASE CONFIG
================================ */

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};


/* ===============================
   INITIALIZE
================================ */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ===============================
   VARIABLES
================================ */

let currentUser = null;

let localStream = null;

let currentInvite = null;

let currentCall = null;

let pendingGuest = null;

let mirror = false;

let bgIndex = 0;


/* ===============================
   DOM
================================ */

const status =
document.getElementById("status");

const localVideo =
document.getElementById("localVideo");

const videoText =
document.getElementById("videoText");

const incoming =
document.getElementById("incoming");

const callerName =
document.getElementById("callerName");


/* ===============================
   AUTH
================================ */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      window.location.href =
        "index.html";

      return;

    }

    currentUser = user;

    status.textContent =
      "🟢 Admin Online";

  }
);


/* ===============================
   CAMERA
================================ */

async function startCamera(){

  try{

    if(localStream) return;

    localStream =
      await navigator
      .mediaDevices
      .getUserMedia({

        video:true,

        audio:true

      });

    localVideo.srcObject =
      localStream;

    localVideo.style.display =
      "block";

    videoText.style.display =
      "none";

  }

  catch(error){

    console.error(error);

    alert(
      "Camera/Microphone permission दें।"
    );

  }

}


/* ===============================
   MIC
================================ */

function toggleMic(){

  if(!localStream) return;

  localStream
  .getAudioTracks()
  .forEach(track => {

    track.enabled =
      !track.enabled;

  });

}


/* ===============================
   CAMERA
================================ */

function toggleCamera(){

  if(!localStream) return;

  localStream
  .getVideoTracks()
  .forEach(track => {

    track.enabled =
      !track.enabled;

  });

}


/* ===============================
   MIRROR
================================ */

function toggleMirror(){

  mirror = !mirror;

  localVideo.style.transform =
    mirror
    ? "scaleX(-1)"
    : "scaleX(1)";

}


/* ===============================
   BACKGROUND
================================ */

function changeBackground(){

  const backgrounds = [
    "#000",
    "#172554",
    "#064e3b",
    "#3f0764",
    "#431407"
  ];

  bgIndex++;

  if(bgIndex >= backgrounds.length)
    bgIndex = 0;

  document
  .querySelector(".videoArea")
  .style.background =
    backgrounds[bgIndex];

}


/* ===============================
   CREATE INVITE
================================ */

async function createInvite(){

  if(!currentUser){

    alert("Admin authentication wait करें।");

    return;

  }

  const token =
    crypto.randomUUID();

  const inviteRef =
    doc(
      db,
      "invites",
      token
    );

  await setDoc(
    inviteRef,
    {
      token:token,

      adminUid:
        currentUser.uid,

      active:true,

      status:"waiting",

      createdAt:
        serverTimestamp()
    }
  );

  currentInvite = token;

  const url =
    window.location.origin +
    window.location.pathname
    .replace(
      "admin.html",
      "guest.html"
    ) +
    "?invite=" +
    encodeURIComponent(token);

  document
  .getElementById("inviteLink")
  .value = url;

  document
  .getElementById("inviteMsg")
  .textContent =
    "✅ Secure Invite तैयार है। Family को भेजें।";

  listenForGuest(token);

}


/* ===============================
   LISTEN FOR GUEST
================================ */

function listenForGuest(token){

  const inviteRef =
    doc(
      db,
      "invites",
      token
    );

  onSnapshot(
    inviteRef,
    snapshot => {

      if(!snapshot.exists())
        return;

      const data =
        snapshot.data();

      if(
        data.status === "calling"
      ){

        pendingGuest = data;

        callerName.textContent =
          data.guestName ||
          "Family Member";

        incoming.style.display =
          "block";

      }

      if(
        data.status === "ended"
      ){

        incoming.style.display =
          "none";

      }

    }
  );

}


/* ===============================
   ACCEPT
================================ */

async function acceptCall(){

  if(!currentInvite)
    return;

  incoming.style.display =
    "none";

  await startCamera();

  const inviteRef =
    doc(
      db,
      "invites",
      currentInvite
    );

  await updateDoc(
    inviteRef,
    {
      status:"accepted"
    }
  );

}


/* ===============================
   REJECT
================================ */

async function rejectCall(){

  incoming.style.display =
    "none";

  if(!currentInvite)
    return;

  await updateDoc(
    doc(
      db,
      "invites",
      currentInvite
    ),
    {
      status:"rejected"
    }
  );

}


/* ===============================
   COPY
================================ */

async function copyInvite(){

  const input =
    document.getElementById(
      "inviteLink"
    );

  if(!input.value){

    alert("पहले Create Invite करें।");

    return;

  }

  try{

    await navigator
      .clipboard
      .writeText(
        input.value
      );

    document
    .getElementById(
      "inviteMsg"
    )
    .textContent =
      "✅ Link copied!";

  }

  catch{

    input.select();

    document.execCommand(
      "copy"
    );

  }

}


/* ===============================
   END CALL
================================ */

async function endCall(){

  if(localStream){

    localStream
    .getTracks()
    .forEach(
      track =>
      track.stop()
    );

    localStream = null;

  }

  localVideo.srcObject =
    null;

  localVideo.style.display =
    "none";

  videoText.style.display =
    "flex";

  if(currentInvite){

    try{

      await updateDoc(
        doc(
          db,
          "invites",
          currentInvite
        ),
        {
          status:"ended"
        }
      );

    }
    catch(e){
      console.error(e);
    }

  }

}


/* ===============================
   LOGOUT
================================ */

async function logout(){

  await signOut(auth);

  window.location.href =
    "index.html";

}


/* ===============================
   EVENTS
================================ */

document
.getElementById("cameraBtn")
.onclick = startCamera;

document
.getElementById("cameraBtn2")
.onclick = startCamera;

document
.getElementById("micBtn")
.onclick = toggleMic;

document
.getElementById("micBtn2")
.onclick = toggleMic;

document
.getElementById("mirrorBtn")
.onclick = toggleMirror;

document
.getElementById("mirrorBtn2")
.onclick = toggleMirror;

document
.getElementById("bgBtn")
.onclick = changeBackground;

document
.getElementById("bgBtn2")
.onclick = changeBackground;

document
.getElementById("endBtn")
.onclick = endCall;

document
.getElementById("endBtn2")
.onclick = endCall;

document
.getElementById("createInviteBtn")
.onclick = createInvite;

document
.getElementById("copyBtn")
.onclick = copyInvite;

document
.getElementById("acceptBtn")
.onclick = acceptCall;

document
.getElementById("rejectBtn")
.onclick = rejectCall;

document
.getElementById("logoutBtn")
.onclick = logout;

</script>

</body>
</html>
