<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0">

<title>Family Connect Call</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#020617;
  color:#fff;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

header{
  height:58px;
  background:#0f172a;
  border-bottom:1px solid #334155;
  display:flex;
  align-items:center;
  padding:0 14px;
}

.title{
  font-weight:bold;
}

.status{
  margin-left:auto;
  color:#86efac;
  font-size:12px;
}

.main{
  height:calc(100vh - 58px);
  padding:8px;
}

.videos{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.videoBox{
  position:relative;
  background:#000;
  border:1px solid #334155;
  border-radius:15px;
  overflow:hidden;
}

video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.label{
  position:absolute;
  top:9px;
  left:9px;
  background:rgba(0,0,0,.65);
  padding:6px 9px;
  border-radius:7px;
  font-size:12px;
  z-index:2;
}

.bottom{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  z-index:20;
}

.control{
  width:48px;
  height:48px;
  border:0;
  border-radius:50%;
  background:#1e293b;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

.end{
  background:#dc2626;
}

.sidebar{
  position:fixed;
  top:0;
  left:-250px;
  width:245px;
  height:100vh;
  background:#0f172a;
  border-right:1px solid #334155;
  z-index:100;
  padding:15px;
  transition:.25s;
}

.sidebar.open{
  left:0;
}

.close{
  float:right;
  background:#1e293b;
  color:white;
  border:0;
  width:35px;
  height:35px;
  border-radius:8px;
}

.sideBtn{
  width:100%;
  height:45px;
  border:0;
  border-radius:8px;
  background:#1e293b;
  color:white;
  margin-top:9px;
  text-align:left;
  padding:0 12px;
}

@media(max-width:700px){

  .videos{
    grid-template-columns:1fr;
    grid-template-rows:1fr 1fr;
  }

}

</style>

</head>

<body>

<header>

  <div class="title">
    👨‍👩‍👧‍👦 Family Connect
  </div>

  <div
    id="status"
    class="status">

    Connecting...

  </div>

</header>


<div
  id="sidebar"
  class="sidebar">

  <button
    class="close"
    id="closeMenu">

    ✕

  </button>

  <h2>🎛️ Controls</h2>

  <button
    class="sideBtn"
    id="micSide">

    🎙️ Microphone

  </button>

  <button
    class="sideBtn"
    id="cameraSide">

    📹 Camera

  </button>

  <button
    class="sideBtn"
    id="mirrorSide">

    🔄 Mirror

  </button>

  <button
    class="sideBtn"
    id="bgSide">

    🖼️ Background

  </button>

  <button
    class="sideBtn"
    id="endSide">

    📞 End Call

  </button>

</div>


<div class="main">

  <div class="videos">

    <div class="videoBox">

      <div class="label">
        📷 You
      </div>

      <video
        id="localVideo"
        autoplay
        muted
        playsinline>
      </video>

    </div>


    <div class="videoBox">

      <div class="label">
        👑 Admin
      </div>

      <video
        id="remoteVideo"
        autoplay
        playsinline>
      </video>

    </div>

  </div>

</div>


<div class="bottom">

  <button
    class="control"
    id="menuBtn">

    ☰

  </button>

  <button
    class="control"
    id="micBtn">

    🎙️

  </button>

  <button
    class="control"
    id="cameraBtn">

    📹

  </button>

  <button
    class="control"
    id="mirrorBtn">

    🔄

  </button>

  <button
    class="control end"
    id="endBtn">

    📞

  </button>

</div>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getFirestore,
  doc,
  onSnapshot,
  updateDoc,
  setDoc,
  serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   CONFIG
========================================= */

const firebaseConfig = {

  apiKey:"YOUR_API_KEY",

  authDomain:
    "YOUR_PROJECT.firebaseapp.com",

  projectId:
    "YOUR_PROJECT_ID",

  storageBucket:
    "YOUR_PROJECT.firebasestorage.app",

  messagingSenderId:
    "YOUR_SENDER_ID",

  appId:
    "YOUR_APP_ID"

};


const app =
  initializeApp(
    firebaseConfig
  );

const db =
  getFirestore(app);


/* =========================================
   DATA
========================================= */

const inviteToken =
  sessionStorage.getItem(
    "inviteToken"
  );

const guestName =
  sessionStorage.getItem(
    "guestName"
  ) || "Guest";


if(!inviteToken){

  alert(
    "Invalid invitation."
  );

  window.location.href =
    "index.html";

}


/* =========================================
   DOM
========================================= */

const localVideo =
  document.getElementById(
    "localVideo"
  );

const remoteVideo =
  document.getElementById(
    "remoteVideo"
  );

const status =
  document.getElementById(
    "status"
  );


let localStream = null;

let peerConnection = null;

let mirror = false;

let bgIndex = 0;


/* =========================================
   WEBRTC CONFIG
========================================= */

const rtcConfig = {

  iceServers:[
    {
      urls:
      "stun:stun.l.google.com:19302"
    },

    {
      urls:
      "stun:stun1.l.google.com:19302"
    }
  ]

};


/* =========================================
   START MEDIA
========================================= */

async function startMedia(){

  localStream =
    await navigator
    .mediaDevices
    .getUserMedia({

      video:true,

      audio:true

    });


  localVideo.srcObject =
    localStream;

}


/* =========================================
   OFFER
========================================= */

async function createOffer(){

  peerConnection =
    new RTCPeerConnection(
      rtcConfig
    );


  localStream
  .getTracks()
  .forEach(
    track => {

      peerConnection
      .addTrack(
        track,
        localStream
      );

    }
  );


  peerConnection.ontrack =
    event => {

      remoteVideo.srcObject =
        event.streams[0];

      status.textContent =
        "🟢 Connected";

    };


  peerConnection.onicecandidate =
    async event => {

      if(
        event.candidate
      ){

        await setDoc(

          doc(
            db,
            "calls",
            inviteToken,
            "adminCandidates",
            crypto.randomUUID()
          ),

          {
            candidate:
              event.candidate.toJSON()
          }

        );

      }

    };


  const offer =
    await peerConnection
    .createOffer();


  await peerConnection
    .setLocalDescription(
      offer
    );


  await setDoc(

    doc(
      db,
      "calls",
      inviteToken
    ),

    {
      offer:{
        type:
          offer.type,

        sdp:
          offer.sdp
      },

      guestName:
        guestName,

      status:
        "offer-created",

      createdAt:
        serverTimestamp()

    }

  );

}


/* =========================================
   WAIT FOR ADMIN
========================================= */

function listenForAdmin(){

  const callRef =
    doc(
      db,
      "calls",
      inviteToken
    );


  onSnapshot(
    callRef,
    async snapshot => {

      if(!snapshot.exists())
        return;


      const data =
        snapshot.data();


      if(
        data.answer &&
        peerConnection &&
        !peerConnection.currentRemoteDescription
      ){

        await peerConnection
        .setRemoteDescription(
          data.answer
        );

      }


      if(
        data.status === "rejected"
      ){

        alert(
          "Admin ने Call Reject कर दी।"
        );

        endCall();

      }


      if(
        data.status === "ended"
      ){

        endCall();

      }

    }
  );

}


/* =========================================
   MIRROR
========================================= */

function toggleMirror(){

  mirror =
    !mirror;

  localVideo.style.transform =
    mirror
    ? "scaleX(-1)"
    : "scaleX(1)";

}


/* =========================================
   MIC
========================================= */

function toggleMic(){

  if(!localStream)
    return;

  localStream
  .getAudioTracks()
  .forEach(
    track => {

      track.enabled =
        !track.enabled;

    }
  );

}


/* =========================================
   CAMERA
========================================= */

function toggleCamera(){

  if(!localStream)
    return;

  localStream
  .getVideoTracks()
  .forEach(
    track => {

      track.enabled =
        !track.enabled;

    }
  );

}


/* =========================================
   BACKGROUND
========================================= */

function changeBackground(){

  const colors=[
    "#000",
    "#172554",
    "#064e3b",
    "#3b0764",
    "#431407"
  ];

  bgIndex++;

  if(
    bgIndex >= colors.length
  )
    bgIndex=0;

  document
  .querySelector(
    ".videoBox"
  )
  .style.background =
    colors[bgIndex];

}


/* =========================================
   END
========================================= */

async function endCall(){

  if(
    peerConnection
  ){

    peerConnection.close();

  }


  if(localStream){

    localStream
    .getTracks()
    .forEach(
      track =>
      track.stop()
    );

  }


  try{

    await updateDoc(

      doc(
        db,
        "invites",
        inviteToken
      ),

      {
        status:"ended"
      }

    );

  }
  catch(e){}


  window.location.href =
    "guest.html";

}


/* =========================================
   MENU
========================================= */

document
.getElementById(
  "menuBtn"
)
.onclick =
function(){

  document
  .getElementById(
    "sidebar"
  )
  .classList.add(
    "open"
  );

};


document
.getElementById(
  "closeMenu"
)
.onclick =
function(){

  document
  .getElementById(
    "sidebar"
  )
  .classList.remove(
    "open"
  );

};


/* =========================================
   BUTTONS
========================================= */

document
.getElementById("micBtn")
.onclick =
toggleMic;

document
.getElementById("micSide")
.onclick =
toggleMic;

document
.getElementById("cameraBtn")
.onclick =
toggleCamera;

document
.getElementById("cameraSide")
.onclick =
toggleCamera;

document
.getElementById("mirrorBtn")
.onclick =
toggleMirror;

document
.getElementById("mirrorSide")
.onclick =
toggleMirror;

document
.getElementById("bgSide")
.onclick =
changeBackground;

document
.getElementById("endBtn")
.onclick =
endCall;

document
.getElementById("endSide")
.onclick =
endCall;


/* =========================================
   START
========================================= */

(async function(){

  try{

    status.textContent =
      "🎙️ Requesting permission...";

    await startMedia();

    status.textContent =
      "🟡 Calling Admin...";

    listenForAdmin();

    await createOffer();

    status.textContent =
      "🟡 Waiting for Admin...";

  }

  catch(error){

    console.error(error);

    status.textContent =
      "🔴 Camera/Mic Error";

    alert(
      "Camera/Microphone permission दें।"
    );

  }

})();

</script>

</body>
</html>
