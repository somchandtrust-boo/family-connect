<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Family Connect</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#020617;
  color:white;
  overflow:hidden;
}

/* ================= HEADER ================= */

.header{
  height:58px;
  background:#0f172a;
  display:flex;
  align-items:center;
  padding:0 15px;
  border-bottom:1px solid #1e293b;
}

.menuBtn{
  width:42px;
  height:42px;
  border:0;
  border-radius:10px;
  background:#1e293b;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.logo{
  margin-left:12px;
  font-weight:bold;
  font-size:18px;
}

.status{
  margin-left:auto;
  font-size:12px;
  color:#86efac;
}

/* ================= SIDEBAR ================= */

.sidebar{
  position:fixed;
  top:0;
  left:-285px;
  width:270px;
  height:100vh;
  background:#0f172a;
  z-index:1000;
  padding:18px;
  transition:.3s;
  box-shadow:10px 0 30px rgba(0,0,0,.4);
}

.sidebar.open{
  left:0;
}

.sideTitle{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.sideTitle h2{
  margin:0;
  font-size:19px;
}

.closeBtn{
  background:#1e293b;
  color:white;
  border:0;
  width:36px;
  height:36px;
  border-radius:9px;
  font-size:18px;
}

.sideButton{
  width:100%;
  height:48px;
  margin-bottom:9px;
  border:0;
  border-radius:11px;
  color:white;
  font-size:15px;
  text-align:left;
  padding:0 15px;
  cursor:pointer;
}

.sideButton span{
  display:inline-block;
  width:30px;
  font-size:20px;
}

.videoBtn{background:#16a34a;}
.audioBtn{background:#2563eb;}
.muteBtn{background:#b45309;}
.cameraBtn{background:#7c3aed;}
.mirrorBtn{background:#0891b2;}
.backgroundBtn{background:#db2777;}
.endBtn{background:#dc2626;}
.shareBtn{background:#0f766e;}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:900;
}

.overlay.show{
  display:block;
}

/* ================= MAIN ================= */

.main{
  height:calc(100vh - 58px);
  padding:12px;
}

.videos{
  height:100%;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.videoBox{
  position:relative;
  background:#000;
  border-radius:15px;
  overflow:hidden;
  border:1px solid #1e293b;
}

.videoBox video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.videoLabel{
  position:absolute;
  top:10px;
  left:10px;
  padding:6px 9px;
  background:rgba(0,0,0,.65);
  border-radius:8px;
  font-size:12px;
  z-index:5;
}

/* ================= MINI PANEL ================= */

.bottomPanel{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(600px,calc(100% - 25px));
  background:rgba(15,23,42,.94);
  border:1px solid #334155;
  border-radius:14px;
  padding:9px;
  display:flex;
  gap:7px;
  align-items:center;
  backdrop-filter:blur(12px);
}

.smallInput{
  min-width:0;
  flex:1;
  height:34px;
  background:#020617;
  color:white;
  border:1px solid #334155;
  border-radius:7px;
  padding:0 8px;
  font-size:11px;
  outline:none;
}

.smallButton{
  height:34px;
  padding:0 10px;
  border:0;
  border-radius:7px;
  background:#334155;
  color:white;
  font-size:12px;
  cursor:pointer;
}

/* ================= BACKGROUND MENU ================= */

.bgPanel{
  display:none;
  position:fixed;
  left:285px;
  bottom:20px;
  width:250px;
  background:#0f172a;
  border:1px solid #334155;
  border-radius:14px;
  padding:14px;
  z-index:1100;
}

.bgPanel.show{
  display:block;
}

.bgPanel h3{
  margin:0 0 12px;
  font-size:15px;
}

.bgGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.bgGrid button{
  height:38px;
  border:0;
  border-radius:8px;
  color:white;
  cursor:pointer;
}

.bg1{background:linear-gradient(135deg,#0f172a,#1e3a8a);}
.bg2{background:linear-gradient(135deg,#14532d,#16a34a);}
.bg3{background:linear-gradient(135deg,#581c87,#9333ea);}
.bg4{background:linear-gradient(135deg,#7c2d12,#ea580c);}
.bg5{background:#f8fafc;color:#111!important;}
.bg6{background:#000;}

@media(max-width:700px){

  .videos{
    grid-template-columns:1fr;
  }

  .videoBox:first-child{
    height:55%;
  }

  .videoBox:last-child{
    height:45%;
  }

  .main{
    padding:7px;
  }

  .bottomPanel{
    bottom:7px;
    width:calc(100% - 14px);
  }

  .smallInput{
    font-size:10px;
  }

  .bgPanel{
    left:10px;
    bottom:65px;
  }

}

@media(min-width:701px){

  .menuBtn{
    display:block;
  }

}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

  <button class="menuBtn" onclick="openSidebar()">
    ☰
  </button>

  <div class="logo">
    👨‍👩‍👧‍👦 Family Connect
  </div>

  <div class="status" id="status">
    Connecting...
  </div>

</div>


<!-- ================= OVERLAY ================= -->

<div
  class="overlay"
  id="overlay"
  onclick="closeSidebar()">
</div>


<!-- ================= SIDEBAR ================= -->

<div class="sidebar" id="sidebar">

  <div class="sideTitle">

    <h2>🎛️ Controls</h2>

    <button
      class="closeBtn"
      onclick="closeSidebar()">
      ✕
    </button>

  </div>


  <button
    class="sideButton videoBtn"
    onclick="startVideoCall()">

    <span>📹</span>
    Video Call

  </button>


  <button
    class="sideButton audioBtn"
    onclick="startAudioCall()">

    <span>🎙️</span>
    Audio Call

  </button>


  <button
    class="sideButton muteBtn"
    onclick="toggleMute()">

    <span>🔇</span>
    Mic ON / OFF

  </button>


  <button
    class="sideButton cameraBtn"
    onclick="toggleCamera()">

    <span>📷</span>
    Camera ON / OFF

  </button>


  <button
    class="sideButton mirrorBtn"
    onclick="toggleMirror()">

    <span>🔄</span>
    Mirror ON / OFF

  </button>


  <button
    class="sideButton backgroundBtn"
    onclick="toggleBackground()">

    <span>🖼️</span>
    Background

  </button>


  <button
    class="sideButton shareBtn"
    onclick="shareLink()">

    <span>📤</span>
    Share Link

  </button>


  <button
    class="sideButton endBtn"
    onclick="endCall()">

    <span>📞</span>
    End Call

  </button>

</div>


<!-- ================= MAIN VIDEO ================= -->

<div class="main">

  <div class="videos">

    <div
      class="videoBox"
      id="localBox">

      <div class="videoLabel">
        📷 You
      </div>

      <video
        id="localVideo"
        autoplay
        muted
        playsinline>
      </video>

    </div>


    <div class="videoBox">

      <div class="videoLabel">
        👤 Family / Guest
      </div>

      <video
        id="remoteVideo"
        autoplay
        playsinline>
      </video>

    </div>

  </div>

</div>


<!-- ================= COMPACT ROOM PANEL ================= -->

<div class="bottomPanel">

  <input
    class="smallInput"
    id="name"
    placeholder="Name">

  <input
    class="smallInput"
    id="remoteId"
    placeholder="Room ID">

  <button
    class="smallButton"
    onclick="copyRoomID()">
    ID
  </button>

  <button
    class="smallButton"
    onclick="shareLink()">
    🔗
  </button>

</div>


<!-- ================= BACKGROUND PANEL ================= -->

<div
  class="bgPanel"
  id="bgPanel">

  <h3>
    🖼️ Background
  </h3>

  <div class="bgGrid">

    <button
      class="bg1"
      onclick="setBackground('bg1')">
      🌌 Blue
    </button>

    <button
      class="bg2"
      onclick="setBackground('bg2')">
      🌿 Green
    </button>

    <button
      class="bg3"
      onclick="setBackground('bg3')">
      💜 Purple
    </button>

    <button
      class="bg4"
      onclick="setBackground('bg4')">
      🌅 Sunset
    </button>

    <button
      class="bg5"
      onclick="setBackground('bg5')">
      ⚪ White
    </button>

    <button
      class="bg6"
      onclick="setBackground('bg6')">
      ⚫ Dark
    </button>

    <button
      onclick="resetBackground()">
      🔄 Reset
    </button>

  </div>

</div>


<script>

/* =========================================
   VARIABLES
========================================= */

let peer;

let localStream = null;

let currentCall = null;

let mirrorEnabled = false;


const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const localBox =
  document.getElementById("localBox");

const statusText =
  document.getElementById("status");

const sidebar =
  document.getElementById("sidebar");

const overlay =
  document.getElementById("overlay");

const bgPanel =
  document.getElementById("bgPanel");


/* =========================================
   SIDEBAR
========================================= */

function openSidebar(){

  sidebar.classList.add("open");

  overlay.classList.add("show");

}


function closeSidebar(){

  sidebar.classList.remove("open");

  overlay.classList.remove("show");

}


/* =========================================
   PEER
========================================= */

peer = new Peer();


peer.on("open",function(id){

  statusText.textContent =
    "● Online";

  createShareLink(id);

});


/* =========================================
   INCOMING CALL
========================================= */

peer.on("call",async function(call){

  currentCall = call;

  try{

    const stream =
      await startLocalMedia(true);

    call.answer(stream);

    call.on(
      "stream",
      function(remoteStream){

        remoteVideo.srcObject =
          remoteStream;

        statusText.textContent =
          "● Connected";

      }
    );

  }
  catch(error){

    alert(
      "Camera/Microphone permission required."
    );

  }

});


/* =========================================
   START VIDEO CALL
========================================= */

async function startVideoCall(){

  const remoteId =
    document
      .getElementById("remoteId")
      .value
      .trim();


  if(!remoteId){

    alert("Room ID डालें।");

    return;

  }


  try{

    const stream =
      await startLocalMedia(true);


    currentCall =
      peer.call(
        remoteId,
        stream
      );


    currentCall.on(
      "stream",
      function(remoteStream){

        remoteVideo.srcObject =
          remoteStream;

        statusText.textContent =
          "● Video Connected";

      }
    );

  }
  catch(error){

    alert(
      error.message
    );

  }

}


/* =========================================
   AUDIO CALL
========================================= */

async function startAudioCall(){

  const remoteId =
    document
      .getElementById("remoteId")
      .value
      .trim();


  if(!remoteId){

    alert("Room ID डालें।");

    return;

  }


  try{

    const stream =
      await startLocalMedia(false);


    currentCall =
      peer.call(
        remoteId,
        stream
      );


    currentCall.on(
      "stream",
      function(remoteStream){

        remoteVideo.srcObject =
          remoteStream;

        statusText.textContent =
          "● Audio Connected";

      }
    );

  }
  catch(error){

    alert(
      error.message
    );

  }

}


/* =========================================
   LOCAL MEDIA
========================================= */

async function startLocalMedia(video){

  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  localStream =
    await navigator
      .mediaDevices
      .getUserMedia({

        video:video,

        audio:true

      });


  localVideo.srcObject =
    localStream;


  return localStream;

}


/* =========================================
   MUTE
========================================= */

function toggleMute(){

  if(!localStream){

    alert(
      "पहले Call शुरू करें।"
    );

    return;

  }


  const tracks =
    localStream
      .getAudioTracks();


  if(!tracks.length)return;


  tracks[0].enabled =
    !tracks[0].enabled;


  statusText.textContent =
    tracks[0].enabled
    ? "🎙️ Mic ON"
    : "🔇 Mic OFF";

}


/* =========================================
   CAMERA
========================================= */

function toggleCamera(){

  if(!localStream){

    alert(
      "पहले Video Call शुरू करें।"
    );

    return;

  }


  const tracks =
    localStream
      .getVideoTracks();


  if(!tracks.length){

    alert(
      "Audio Call में Camera नहीं है।"
    );

    return;

  }


  tracks[0].enabled =
    !tracks[0].enabled;


  statusText.textContent =
    tracks[0].enabled
    ? "📷 Camera ON"
    : "📷 Camera OFF";

}


/* =========================================
   MIRROR
========================================= */

function toggleMirror(){

  mirrorEnabled =
    !mirrorEnabled;


  localVideo.style.transform =
    mirrorEnabled
    ? "scaleX(-1)"
    : "scaleX(1)";


  statusText.textContent =
    mirrorEnabled
    ? "🔄 Mirror ON"
    : "🔄 Mirror OFF";

}


/* =========================================
   BACKGROUND
========================================= */

function toggleBackground(){

  bgPanel.classList.toggle("show");

}


function setBackground(type){

  localBox.classList.remove(
    "bg1",
    "bg2",
    "bg3",
    "bg4",
    "bg5",
    "bg6"
  );


  localBox.classList.add(type);

  statusText.textContent =
    "🖼️ Background Changed";

}


function resetBackground(){

  localBox.classList.remove(
    "bg1",
    "bg2",
    "bg3",
    "bg4",
    "bg5",
    "bg6"
  );

}


/* =========================================
   END CALL
========================================= */

function endCall(){

  if(currentCall){

    try{
      currentCall.close();
    }
    catch(e){}

    currentCall = null;

  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    localStream = null;

  }


  localVideo.srcObject = null;

  remoteVideo.srcObject = null;

  statusText.textContent =
    "● Ready";

}


/* =========================================
   SHARE LINK
========================================= */

function createShareLink(id){

  const url =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(id);


  window.familyConnectLink =
    url;

}


async function shareLink(){

  const link =
    window.familyConnectLink;


  if(!link){

    alert(
      "Link अभी तैयार नहीं है।"
    );

    return;

  }


  if(navigator.share){

    try{

      await navigator.share({

        title:
          "Family Connect",

        text:
          "Video/Audio Call के लिए जुड़ें",

        url:link

      });

    }
    catch(e){}

  }
  else{

    await navigator
      .clipboard
      .writeText(link);

    alert(
      "Share Link Copy हो गया।"
    );

  }

}


/* =========================================
   COPY ROOM ID
========================================= */

function copyRoomID(){

  const id =
    peer.id;


  if(!id){

    alert(
      "Room ID अभी तैयार नहीं है।"
    );

    return;

  }


  navigator
    .clipboard
    .writeText(id);


  statusText.textContent =
    "✅ Room ID Copied";

}


/* =========================================
   AUTO ROOM ID
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const room =
  params.get("room");


if(room){

  document
    .getElementById("remoteId")
    .value = room;

}


/* =========================================
   ERROR
========================================= */

peer.on(
  "error",
  function(error){

    console.error(error);

    statusText.textContent =
      "● Connection Error";


    if(
      error.type ===
      "peer-unavailable"
    ){

      alert(
        "सामने वाला अभी Online नहीं है।"
      );

    }

  }
);

</script>

</body>
</html>
