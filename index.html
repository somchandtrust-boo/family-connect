<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Family Connect</title>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#020617,#172554);
  color: white;
}

header {
  text-align: center;
  padding: 18px;
  background: rgba(0,0,0,.25);
}

header h1 {
  margin: 0;
  font-size: 27px;
}

#status {
  margin-top: 7px;
  font-size: 14px;
  color: #86efac;
}

.container {
  width: 100%;
  max-width: 1000px;
  margin: auto;
  padding: 15px;
}

.videos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.videoBox {
  position: relative;
  background: #020617;
  border-radius: 16px;
  overflow: hidden;
  min-height: 280px;
  border: 1px solid rgba(255,255,255,.1);
}

.videoBox video {
  width: 100%;
  height: 100%;
  min-height: 280px;
  object-fit: cover;
  background: #000;
}

.label {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 5;
  padding: 7px 10px;
  background: rgba(0,0,0,.65);
  border-radius: 8px;
  font-size: 13px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 15px;
}

input {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 14px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  color: white;
}

button:active {
  transform: scale(.98);
}

.videoBtn {
  background: #16a34a;
}

.audioBtn {
  background: #2563eb;
}

.muteBtn {
  background: #f59e0b;
}

.cameraBtn {
  background: #7c3aed;
}

.mirrorBtn {
  background: #0891b2;
}

.backgroundBtn {
  background: #db2777;
}

.endBtn {
  background: #dc2626;
}

.copyBtn {
  background: #475569;
}

.shareBtn {
  background: #0f766e;
}

.info {
  margin-top: 15px;
  background: rgba(255,255,255,.08);
  padding: 14px;
  border-radius: 12px;
  word-break: break-all;
}

.info b {
  display: block;
  margin-bottom: 6px;
}

#myId {
  color: #93c5fd;
}

#shareLink {
  color: #86efac;
  font-size: 14px;
}

.backgroundPanel {
  display: none;
  margin-top: 15px;
  padding: 15px;
  background: rgba(0,0,0,.35);
  border-radius: 15px;
}

.backgroundPanel h3 {
  margin-top: 0;
}

.bgButtons {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 8px;
}

.bgButtons button {
  background: #334155;
}

.bg1 {
  background: linear-gradient(135deg,#0f172a,#1e3a8a) !important;
}

.bg2 {
  background: linear-gradient(135deg,#14532d,#166534) !important;
}

.bg3 {
  background: linear-gradient(135deg,#581c87,#7e22ce) !important;
}

.bg4 {
  background: linear-gradient(135deg,#7c2d12,#c2410c) !important;
}

.bg5 {
  background: #f8fafc !important;
  color: #111 !important;
}

.bg6 {
  background: #020617 !important;
}

@media(max-width:700px) {

  .videos {
    grid-template-columns: 1fr;
  }

  .controls {
    grid-template-columns: 1fr;
  }

  .videoBox {
    min-height: 240px;
  }

  .videoBox video {
    min-height: 240px;
  }

  .bgButtons {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<header>

  <h1>👨‍👩‍👧‍👦 Family Connect</h1>

  <div id="status">
    Connecting...
  </div>

</header>


<div class="container">


  <!-- VIDEO AREA -->

  <div class="videos">

    <div class="videoBox" id="localBox">

      <div class="label">
        📷 आपका Camera
      </div>

      <video
        id="localVideo"
        autoplay
        muted
        playsinline>
      </video>

    </div>


    <div class="videoBox">

      <div class="label">
        👤 सामने वाला
      </div>

      <video
        id="remoteVideo"
        autoplay
        playsinline>
      </video>

    </div>

  </div>


  <!-- CONTROLS -->

  <div class="controls">

    <input
      id="name"
      type="text"
      placeholder="अपना नाम लिखें">

    <input
      id="remoteId"
      type="text"
      placeholder="सामने वाले का Room ID">


    <button
      class="videoBtn"
      onclick="startVideoCall()">

      📹 Video Call

    </button>


    <button
      class="audioBtn"
      onclick="startAudioCall()">

      🎙️ Audio Call

    </button>


    <button
      class="muteBtn"
      onclick="toggleMute()">

      🔇 Mic Mute

    </button>


    <button
      class="cameraBtn"
      onclick="toggleCamera()">

      📷 Camera ON/OFF

    </button>


    <button
      class="mirrorBtn"
      onclick="toggleMirror()">

      🔄 Mirror ON/OFF

    </button>


    <button
      class="backgroundBtn"
      onclick="toggleBackgroundPanel()">

      🖼️ Background

    </button>


    <button
      class="endBtn"
      onclick="endCall()">

      📞 End Call

    </button>


    <button
      class="copyBtn"
      onclick="copyRoomID()">

      🔗 Copy Room ID

    </button>

  </div>


  <!-- BACKGROUND PANEL -->

  <div
    class="backgroundPanel"
    id="backgroundPanel">

    <h3>
      🖼️ Background चुनें
    </h3>

    <div class="bgButtons">

      <button
        class="bg1"
        onclick="setBackground('bg1')">
        🌌 Blue
      </button>

      <button
        class="bg2"
        onclick="setBackground('bg2')">
        🌿 Green
      </button>

      <button
        class="bg3"
        onclick="setBackground('bg3')">
        💜 Purple
      </button>

      <button
        class="bg4"
        onclick="setBackground('bg4')">
        🔥 Sunset
      </button>

      <button
        class="bg5"
        onclick="setBackground('bg5')">
        ⚪ White
      </button>

      <button
        class="bg6"
        onclick="setBackground('bg6')">
        ⚫ Dark
      </button>

      <button
        onclick="resetBackground()">
        🔄 Reset
      </button>

    </div>

  </div>


  <!-- ROOM ID -->

  <div class="info">

    <b>
      🆔 आपका Room ID
    </b>

    <span id="myId">
      Connecting...
    </span>

  </div>


  <!-- SHARE LINK -->

  <div class="info">

    <b>
      🔗 Share Link
    </b>

    <div id="shareLink">
      Preparing...
    </div>

    <button
      class="shareBtn"
      style="width:100%;margin-top:10px"
      onclick="shareLink()">

      📤 Family को Link भेजें

    </button>

  </div>

</div>


<script>

/* =========================================
   VARIABLES
========================================= */

let peer = null;

let localStream = null;

let currentCall = null;

let mirrorEnabled = false;

const localVideo =
  document.getElementById("localVideo");

const remoteVideo =
  document.getElementById("remoteVideo");

const localBox =
  document.getElementById("localBox");

const statusText =
  document.getElementById("status");

const myIdText =
  document.getElementById("myId");

const shareLinkText =
  document.getElementById("shareLink");

const backgroundPanel =
  document.getElementById("backgroundPanel");


/* =========================================
   PEER CONNECTION
========================================= */

peer = new Peer();


peer.on("open", function(id) {

  myIdText.textContent = id;

  statusText.textContent =
    "✅ Ready to Connect";

  createShareLink(id);

});


/* =========================================
   INCOMING CALL
========================================= */

peer.on("call", async function(call) {

  currentCall = call;

  try {

    const stream =
      await startLocalMedia(true);

    call.answer(stream);

    call.on("stream", function(remoteStream) {

      remoteVideo.srcObject =
        remoteStream;

      statusText.textContent =
        "🟢 Video Call Connected";

    });

    call.on("close", function() {

      endCall();

    });

  }

  catch(error) {

    alert(
      "Camera/Microphone permission नहीं मिली।\n\n" +
      error.message
    );

  }

});


/* =========================================
   VIDEO CALL
========================================= */

async function startVideoCall() {

  const remoteId =
    document.getElementById("remoteId")
    .value
    .trim();

  if (!remoteId) {

    alert(
      "सामने वाले का Room ID डालें।"
    );

    return;
  }


  try {

    const stream =
      await startLocalMedia(true);


    currentCall =
      peer.call(
        remoteId,
        stream
      );


    currentCall.on(
      "stream",
      function(remoteStream) {

        remoteVideo.srcObject =
          remoteStream;

        statusText.textContent =
          "🟢 Video Call Connected";

      }
    );


    currentCall.on(
      "close",
      function() {

        endCall();

      }
    );


    currentCall.on(
      "error",
      function(error) {

        alert(
          "Call Error: " +
          error.message
        );

      }
    );

  }

  catch(error) {

    alert(
      "Camera/Microphone शुरू नहीं हो सके:\n" +
      error.message
    );

  }

}


/* =========================================
   AUDIO CALL
========================================= */

async function startAudioCall() {

  const remoteId =
    document.getElementById("remoteId")
    .value
    .trim();


  if (!remoteId) {

    alert(
      "सामने वाले का Room ID डालें।"
    );

    return;

  }


  try {

    const stream =
      await startLocalMedia(false);


    currentCall =
      peer.call(
        remoteId,
        stream
      );


    currentCall.on(
      "stream",
      function(remoteStream) {

        remoteVideo.srcObject =
          remoteStream;

        statusText.textContent =
          "🟢 Audio Call Connected";

      }
    );


  }

  catch(error) {

    alert(
      "Microphone permission नहीं मिली:\n" +
      error.message
    );

  }

}


/* =========================================
   CAMERA + MICROPHONE
========================================= */

async function startLocalMedia(
  videoEnabled
) {

  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

  }


  localStream =
    await navigator
      .mediaDevices
      .getUserMedia({

        video: videoEnabled,

        audio: true

      });


  localVideo.srcObject =
    localStream;


  return localStream;

}


/* =========================================
   MUTE
========================================= */

function toggleMute() {

  if (!localStream) {

    alert(
      "पहले Call शुरू करें।"
    );

    return;

  }


  const audioTracks =
    localStream.getAudioTracks();


  if (!audioTracks.length) {

    return;

  }


  audioTracks[0].enabled =
    !audioTracks[0].enabled;


  statusText.textContent =
    audioTracks[0].enabled
    ? "🎙️ Mic ON"
    : "🔇 Mic OFF";

}


/* =========================================
   CAMERA ON/OFF
========================================= */

function toggleCamera() {

  if (!localStream) {

    alert(
      "पहले Video Call शुरू करें।"
    );

    return;

  }


  const videoTracks =
    localStream.getVideoTracks();


  if (!videoTracks.length) {

    alert(
      "यह Audio Call है।"
    );

    return;

  }


  videoTracks[0].enabled =
    !videoTracks[0].enabled;


  statusText.textContent =
    videoTracks[0].enabled
    ? "📷 Camera ON"
    : "📷 Camera OFF";

}


/* =========================================
   MIRROR
========================================= */

function toggleMirror() {

  mirrorEnabled =
    !mirrorEnabled;


  if (mirrorEnabled) {

    localVideo.style.transform =
      "scaleX(-1)";

    statusText.textContent =
      "🔄 Mirror ON";

  }

  else {

    localVideo.style.transform =
      "scaleX(1)";

    statusText.textContent =
      "🔄 Mirror OFF";

  }

}


/* =========================================
   BACKGROUND PANEL
========================================= */

function toggleBackgroundPanel() {

  if (
    backgroundPanel.style.display ===
    "block"
  ) {

    backgroundPanel.style.display =
      "none";

  }

  else {

    backgroundPanel.style.display =
      "block";

  }

}


/* =========================================
   BACKGROUND CHANGE
========================================= */

function setBackground(type) {

  localBox.classList.remove(
    "bg1",
    "bg2",
    "bg3",
    "bg4",
    "bg5",
    "bg6"
  );


  localBox.classList.add(type);


  statusText.textContent =
    "🖼️ Background Changed";

}


/* =========================================
   RESET BACKGROUND
========================================= */

function resetBackground() {

  localBox.classList.remove(
    "bg1",
    "bg2",
    "bg3",
    "bg4",
    "bg5",
    "bg6"
  );


  statusText.textContent =
    "🔄 Background Reset";

}


/* =========================================
   END CALL
========================================= */

function endCall() {

  if (currentCall) {

    try {

      currentCall.close();

    }

    catch(e) {}

    currentCall = null;

  }


  if (localStream) {

    localStream
      .getTracks()
      .forEach(
        track => track.stop()
      );

    localStream = null;

  }


  localVideo.srcObject = null;

  remoteVideo.srcObject = null;


  statusText.textContent =
    "📞 Call Ended";

}


/* =========================================
   ROOM SHARE LINK
========================================= */

function createShareLink(id) {

  const url =
    window.location.origin +
    window.location.pathname +
    "?room=" +
    encodeURIComponent(id);


  shareLinkText.textContent =
    url;

}


/* =========================================
   COPY ROOM ID
========================================= */

function copyRoomID() {

  const id =
    myIdText.textContent;


  if (
    !id ||
    id === "Connecting..."
  ) {

    alert(
      "Room ID अभी तैयार नहीं है।"
    );

    return;

  }


  navigator.clipboard
    .writeText(id);


  statusText.textContent =
    "✅ Room ID Copy हो गया";

}


/* =========================================
   SHARE LINK
========================================= */

async function shareLink() {

  const link =
    shareLinkText.textContent;


  if (
    !link ||
    link === "Preparing..."
  ) {

    alert(
      "Share Link अभी तैयार नहीं है।"
    );

    return;

  }


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          "Family Connect",

        text:
          "मुझसे Video/Audio Call पर जुड़ने के लिए यह Link खोलें:",

        url:
          link

      });

    }

    catch(e) {}

  }

  else {

    await navigator
      .clipboard
      .writeText(link);


    alert(
      "Link Copy हो गया। अब WhatsApp में भेज सकते हैं।"
    );

  }

}


/* =========================================
   AUTO ROOM ID
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const room =
  params.get("room");


if (room) {

  document
    .getElementById("remoteId")
    .value = room;

}


/* =========================================
   PEER ERROR
========================================= */

peer.on(
  "error",
  function(error) {

    console.error(error);


    statusText.textContent =
      "❌ Connection Error";


    if (
      error.type ===
      "peer-unavailable"
    ) {

      alert(
        "सामने वाला अभी Online नहीं है या Room ID गलत है।"
      );

    }

  }
);

</script>

</body>
</html>
