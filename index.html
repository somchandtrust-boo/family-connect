<!DOCTYPE html>
<html lang="hi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Family Connect - Admin Login</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(
          circle at top,
          #172554 0%,
          #020617 55%,
          #000 100%
        );
      color: white;
    }

    .loginBox {
      width: min(410px, 92%);
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid #334155;
      border-radius: 22px;
      padding: 30px;
      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.6);
    }

    .logo {
      text-align: center;
      font-size: 55px;
      margin-bottom: 5px;
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 13px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #020617;
      color: white;
      padding: 0 14px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,.15);
    }

    .passwordRow {
      position: relative;
    }

    .showPassword {
      position: absolute;
      right: 8px;
      top: 8px;
      height: 34px;
      border: 0;
      border-radius: 7px;
      background: #1e293b;
      color: white;
      cursor: pointer;
      padding: 0 10px;
    }

    .loginBtn {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 10px;
      margin-top: 22px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .loginBtn:hover {
      background: #1d4ed8;
    }

    .loginBtn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      min-height: 22px;
      margin-top: 15px;
      text-align: center;
      font-size: 13px;
    }

    .security {
      text-align: center;
      margin-top: 22px;
      color: #64748b;
      font-size: 11px;
    }

    .connection {
      text-align: center;
      margin-top: 8px;
      font-size: 11px;
      color: #64748b;
    }

  </style>

</head>


<body>


  <div class="loginBox">

    <div class="logo">
      👑
    </div>

    <h1>
      Admin Login
    </h1>

    <div class="subtitle">
      Family Connect Control Center
    </div>


    <!-- EMAIL -->

    <label for="email">
      Admin Email
    </label>

    <input
      id="email"
      type="email"
      placeholder="Enter admin email"
      autocomplete="username">


    <!-- PASSWORD -->

    <label for="password">
      Password
    </label>

    <div class="passwordRow">

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password">

      <button
        type="button"
        class="showPassword"
        id="showPasswordBtn"
        onclick="togglePassword()">

        👁️

      </button>

    </div>


    <!-- LOGIN -->

    <button
      type="button"
      class="loginBtn"
      id="loginBtn"
      onclick="adminLogin()">

      🔐 Login

    </button>


    <!-- MESSAGE -->

    <div
      class="message"
      id="message">
    </div>


    <div class="security">
      🔒 Secure Admin Access
    </div>

    <div
      class="connection"
      id="connection">

      Connecting to Firebase...

    </div>

  </div>


  <!-- ==================================================
       FIREBASE
       ONLY ONE FIREBASE SCRIPT
  ================================================== -->

  <script type="module">

    /*
    =====================================================
    FIREBASE CONFIGURATION
    =====================================================

    नीचे अपना Firebase configuration डालें।

    Firebase Console:
    Project Settings
    →
    General
    →
    Your apps
    →
    Web App
    →
    SDK setup and configuration
    →
    Config
    =====================================================
    */


    const firebaseConfig = {

      apiKey: "YOUR_API_KEY",

      authDomain: "YOUR_PROJECT.firebaseapp.com",

      projectId: "YOUR_PROJECT_ID",

      storageBucket: "YOUR_PROJECT.firebasestorage.app",

      messagingSenderId: "YOUR_SENDER_ID",

      appId: "YOUR_APP_ID"

    };


    /*
    =====================================================
    FIREBASE IMPORT
    =====================================================
    */

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    /*
    =====================================================
    INITIALIZE FIREBASE
    =====================================================
    */

    const firebaseApp =
      initializeApp(firebaseConfig);


    const auth =
      getAuth(firebaseApp);


    /*
    =====================================================
    FIREBASE CONNECTION
    =====================================================
    */

    document
      .getElementById("connection")
      .textContent =
      "🟢 Firebase Ready";


    /*
    =====================================================
    LOGIN FUNCTION
    =====================================================
    */

    window.adminLogin = async function () {

      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const message =
        document
          .getElementById("message");


      const button =
        document
          .getElementById("loginBtn");


      /*
      -------------------------------
      VALIDATION
      -------------------------------
      */

      if (!email) {

        showMessage(
          "❌ Admin Email डालें।",
          "error"
        );

        return;

      }


      if (!password) {

        showMessage(
          "❌ Password डालें।",
          "error"
        );

        return;

      }


      /*
      -------------------------------
      LOGIN START
      -------------------------------
      */

      button.disabled = true;

      button.textContent =
        "⏳ Login हो रहा है...";


      showMessage(
        "कृपया प्रतीक्षा करें...",
        "normal"
      );


      try {

        /*
        Firebase Authentication
        */

        const userCredential =
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          userCredential.user;


        console.log(
          "Admin Login Successful"
        );


        console.log(
          "Admin UID:",
          user.uid
        );


        showMessage(
          "✅ Login सफल! Dashboard खोल रहे हैं...",
          "success"
        );


        /*
        -------------------------------
        ADMIN DASHBOARD
        -------------------------------
        */

        setTimeout(
          function () {

            window.location.href =
              "admin.html";

          },
          1000
        );

      }


      catch (error) {

        console.error(
          "Firebase Login Error:",
          error
        );


        let errorMessage =
          "Login failed.";


        /*
        -------------------------------
        FIREBASE ERROR HANDLING
        -------------------------------
        */

        switch (error.code) {

          case "auth/invalid-credential":

            errorMessage =
              "❌ Email या Password गलत है।";

            break;


          case "auth/invalid-email":

            errorMessage =
              "❌ Email सही format में नहीं है।";

            break;


          case "auth/user-not-found":

            errorMessage =
              "❌ यह Admin account Firebase में नहीं मिला।";

            break;


          case "auth/wrong-password":

            errorMessage =
              "❌ Password गलत है।";

            break;


          case "auth/user-disabled":

            errorMessage =
              "❌ यह Admin account disabled है।";

            break;


          case "auth/too-many-requests":

            errorMessage =
              "❌ बहुत ज्यादा Login attempts हुए हैं। थोड़ी देर बाद कोशिश करें।";

            break;


          case "auth/network-request-failed":

            errorMessage =
              "❌ Internet connection check करें।";

            break;


          default:

            errorMessage =
              "❌ " +
              error.message;

        }


        showMessage(
          errorMessage,
          "error"
        );


        button.disabled =
          false;


        button.textContent =
          "🔐 Login";

      }

    };


    /*
    =====================================================
    MESSAGE FUNCTION
    =====================================================
    */

    function showMessage(
      text,
      type
    ) {

      const message =
        document
          .getElementById("message");


      message.textContent =
        text;


      if (type === "success") {

        message.style.color =
          "#86efac";

      }

      else if (type === "error") {

        message.style.color =
          "#f87171";

      }

      else {

        message.style.color =
          "#94a3b8";

      }

    }


    /*
    =====================================================
    PASSWORD SHOW / HIDE
    =====================================================
    */

    window.togglePassword =
    function () {

      const password =
        document
          .getElementById("password");


      const button =
        document
          .getElementById("showPasswordBtn");


      if (
        password.type ===
        "password"
      ) {

        password.type =
          "text";

        button.textContent =
          "🙈";

      }

      else {

        password.type =
          "password";

        button.textContent =
          "👁️";

      }

    };


    /*
    =====================================================
    ENTER KEY LOGIN
    =====================================================
    */

    document
      .getElementById("password")
      .addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Enter"
          ) {

            window.adminLogin();

          }

        }
      );

  </script>


</body>

</html>
