<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Family Connect - Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  background:#020617;
  color:white;
}

.loginBox{
  width:min(400px,92%);
  background:#0f172a;
  border:1px solid #334155;
  border-radius:20px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.logo{
  text-align:center;
  font-size:48px;
}

h1{
  text-align:center;
  margin:8px 0;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  margin:12px 0 6px;
  font-size:13px;
  color:#cbd5e1;
}

input{
  width:100%;
  height:48px;
  border:1px solid #334155;
  border-radius:10px;
  background:#020617;
  color:white;
  padding:0 13px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#3b82f6;
}

.loginBtn{
  width:100%;
  height:48px;
  border:0;
  border-radius:10px;
  margin-top:20px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.loginBtn:disabled{
  opacity:.6;
}

.message{
  margin-top:15px;
  text-align:center;
  font-size:13px;
  min-height:18px;
}

.footer{
  text-align:center;
  margin-top:22px;
  color:#64748b;
  font-size:11px;
}

</style>

</head>

<body>


<div class="loginBox">

  <div class="logo">
    👑
  </div>

  <h1>
    Admin Login
  </h1>

  <div class="subtitle">
    Family Connect Control Center
  </div>


  <label>
    Email
  </label>

  <input
    id="email"
    type="email"
    placeholder="Admin Email"
    autocomplete="username">


  <label>
    Password
  </label>

  <input
    id="password"
    type="password"
    placeholder="Password"
    autocomplete="current-password">


  <button
    class="loginBtn"
    id="loginBtn"
    onclick="adminLogin()">

    🔐 Login

  </button>


  <div
    class="message"
    id="message">
  </div>


  <div class="footer">
    🔒 Secure Admin Access
  </div>

</div>


<!-- Firebase -->

<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyAVHl9WBOHEolcyduGoeLZGPHZnwsQEKfc",
  authDomain: "family-connect-19bac.firebaseapp.com",
  projectId: "family-connect-19bac",
  storageBucket: "family-connect-19bac.firebasestorage.app",
  messagingSenderId: "728596384464",
  appId: "1:728596384464:web:e1394868b824e1911dacd5"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth =
  getAuth(app);


/* =========================================
   LOGIN
========================================= */

window.adminLogin =
async function(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  const message =
    document
      .getElementById("message");

  const button =
    document
      .getElementById("loginBtn");


  if(!email){

    message.textContent =
      "Email डालें।";

    message.style.color =
      "#f87171";

    return;

  }


  if(!password){

    message.textContent =
      "Password डालें।";

    message.style.color =
      "#f87171";

    return;

  }


  button.disabled =
    true;

  button.textContent =
    "⏳ Login हो रहा है...";


  try{

    const result =
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );


    console.log(
      "Admin Login:",
      result.user.uid
    );


    message.textContent =
      "✅ Login सफल। Dashboard खोल रहे हैं...";

    message.style.color =
      "#86efac";


    /*
      अगला step:
      Admin Dashboard
    */

    setTimeout(
      function(){

        window.location.href =
          "admin.html";

      },
      800
    );


  }

  catch(error){

    console.error(error);


    let text =
      "Login failed.";


    if(
      error.code ===
      "auth/invalid-credential"
    ){

      text =
        "Email या Password गलत है।";

    }

    else if(
      error.code ===
      "auth/too-many-requests"
    ){

      text =
        "बहुत ज्यादा प्रयास हुए हैं। थोड़ी देर बाद कोशिश करें।";

    }

    else if(
      error.code ===
      "auth/user-disabled"
    ){

      text =
        "यह Admin account disabled है।";

    }


    message.textContent =
      "❌ " + text;

    message.style.color =
      "#f87171";


    button.disabled =
      false;

    button.textContent =
      "🔐 Login";

  }

};

</script>

</body>
</html>
